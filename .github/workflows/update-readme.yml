name: 🤖 Update README contributors

# Runs whenever a commit lands on main, a PR is merged, or weekly on schedule.
# Re-generates the leaderboard + snapshot in README.md from live git log + GitHub API
# and commits the change back via github-actions[bot].

on:
  push:
    branches: [main, master]
  pull_request:
    types: [closed]
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # 🔁 Refresh every 12 hours so the leaderboard never goes stale
    # (UTC 00:00 and 12:00 — even if no commit/PR triggered an update)
    - cron: '0 0,12 * * *'

# Cancel any in-flight run when a new push arrives
concurrency:
  group: readme-bot
  cancel-in-progress: true

permissions:
  contents: write    # required for github-actions[bot] to push
  pull-requests: write

jobs:
  update-readme:
    # Only run for merged PRs (skip closed-without-merge)
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so git shortlog is accurate
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 📜 Dry-run preview (for the workflow logs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "─── Leaderboard preview ───"
          node scripts/update-readme-contributors.js --dry-run | tail -80

      - name: ✍️ Regenerate README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme-contributors.js

      - name: 🔍 Show what changed
        run: |
          git --no-pager diff --stat README.md CONTRIBUTORS.md
          echo "─── README.md diff ───"
          git --no-pager diff README.md | head -120 || true
          echo "─── CONTRIBUTORS.md diff ───"
          git --no-pager diff CONTRIBUTORS.md | head -120 || true

      - name: 🚀 Commit via github-actions[bot]
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: |
            🤖 docs(contributors): refresh contributor stats

            Auto-generated by the update-readme workflow.
            - Refreshed leaderboard with current commit + PR counts
            - Synced real names & avatars from GitHub API
            - Updated repo snapshot numbers
            - Regenerated full contributor cards in CONTRIBUTORS.md

            Triggered by: ${{ github.event_name }}
            Commit:       ${{ github.sha }}
          file_pattern: |
            README.md
            CONTRIBUTORS.md
          commit_user_name: 'github-actions[bot]'
          commit_user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          push_options: '--force-with-lease'
          skip_checkout: true
          skip_fetch: true